<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Miarritze Producer</title>
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
<script src="static/pilotage.js" defer></script>
<script src="static/catalogue.js" defer></script>
<script src="static/jeu.js" defer></script>
<script src="static/roadmap.js" defer></script>
<script src="static/bord.js" defer></script>
</head>
<body>
<header class="top">
  <h1 class="brand">PRODUCER</h1>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <a href="#/bord" data-tab="bord"><span class="ti" aria-hidden="true">◉</span><span class="tl">Bord</span></a>
    <a href="#/kanban" data-tab="kanban"><span class="ti" aria-hidden="true">▥</span><span class="tl">Kanban</span><span class="tn" id="nav-qa"></span></a>
    <a href="#/assets" data-tab="assets"><span class="ti" aria-hidden="true">▦</span><span class="tl">Catalogue</span></a>
    <a href="#/jeu" data-tab="jeu"><span class="ti" aria-hidden="true">♟</span><span class="tl">Jeu</span></a>
    <a href="#/roadmap" data-tab="roadmap"><span class="ti" aria-hidden="true">⚑</span><span class="tl">Roadmap</span></a>
    <a href="#/comments" data-tab="comments"><span class="ti" aria-hidden="true">✎</span><span class="tl">Avis</span><span class="tn" id="nav-comments"></span></a>
    <a href="#/aide" data-tab="aide"><span class="ti" aria-hidden="true">?</span><span class="tl">Aide</span></a>
  </nav>
  <div class="top-actions">
    <button type="button" id="theme" class="ghost" title="Fond clair / sombre">◐</button>
    <button type="button" id="logout" class="ghost" hidden>Déconnexion</button>
  </div>
</header>

<main id="app">
  <section id="login" class="login" hidden>
    <form id="login-form" class="panel">
      <h2>Connexion</h2>
      <label>Mot de passe
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Entrer</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <section id="view-bord" class="view" hidden>
    <div id="bord" class="bord"></div>
  </section>

  <section id="view-assets" class="view" hidden>
    <div id="cat-bar" class="cat-bar"></div>
    <div class="assets-main">
      <div id="grid" class="grid"></div>
      <div id="detail" class="detail" hidden></div>
    </div>
  </section>

  <section id="view-kanban" class="view" hidden>
    <div class="kanban-bar">
      <button type="button" id="new-card" class="primary">+ Nouvelle carte</button>
      <input type="search" id="kb-search" placeholder="Rechercher (titre, #id)…" aria-label="Rechercher une carte">
      <select id="kb-type" aria-label="Filtrer par type"></select>
      <select id="kb-perso" aria-label="Filtrer par perso"></select>
      <select id="kb-map" aria-label="Filtrer par carte de jeu"></select>
      <select id="kb-ms" aria-label="Filtrer par jalon"></select>
      <label class="inline">Chapeau <select id="kb-hat" aria-label="Filtrer par chapeau"></select></label>
      <label class="inline"><input type="checkbox" id="kb-hats-only"> Chapeaux seulement</label>
      <label class="inline"><input type="checkbox" id="kb-no-hats"> Masquer les chapeaux</label>
      <label class="inline"><input type="checkbox" id="kb-night-only"> 🌙 Night shift seulement</label>
      <button type="button" id="kb-select" class="small" aria-pressed="false">☑ Sélection</button>
      <button type="button" id="kb-reset" class="small ghost">Effacer les filtres</button>
    </div>
    <div id="kb-bulk" class="kb-bulk" hidden></div>
    <nav id="kb-tabs" class="kb-tabs" aria-label="Colonnes du kanban" hidden></nav>
    <div id="board" class="board"></div>
  </section>

  <section id="view-jeu" class="view" hidden>
    <nav id="jeu-tabs" class="subtabs" aria-label="Gameplay"></nav>
    <div id="jeu" class="jeu"></div>
  </section>

  <section id="view-roadmap" class="view" hidden>
    <div id="roadmap" class="roadmap"></div>
  </section>

  <section id="view-aide" class="view" hidden>
    <div id="aide" class="aide"></div>
  </section>

  <section id="view-comments" class="view" hidden>
    <div class="kanban-bar">
      <label class="inline"><input type="checkbox" id="only-open" checked> Ouverts seulement</label>
    </div>
    <div id="comment-list" class="comment-list"></div>
  </section>
</main>

<dialog id="card-dialog">
  <div id="cf-mbar" class="mbar">
    <button type="button" id="cf-back" class="ghost">← Retour</button>
    <span id="cf-mtitle"></span>
  </div>
  <form id="card-form" method="dialog" class="card-form">
    <h2 id="card-dialog-title">Carte</h2>
    <p class="muted small-text"><span id="cf-origin"></span> <span id="cf-saved" class="save-state" role="status" aria-live="polite"></span></p>
    <p class="rework" id="cf-rework" hidden>↺ Refusée en QA : à retraiter (voir le refus dans l'historique)</p>
    <div class="qa-actions" id="cf-qa" hidden>
      <button type="button" id="cf-accept" class="accept">✓ Accepter</button>
      <button type="button" id="cf-refuse" class="refuse">✗ Refuser</button>
    </div>
    <div class="row">
      <label>Type
        <select id="cf-type">
          <option value="feature">Feature</option><option value="bug">Bug</option>
          <option value="perso">Perso</option><option value="animation">Animation</option>
          <option value="asset">Asset (décor, image…)</option><option value="gameplay">Gameplay</option>
          <option value="pixelforge">Pixelforge</option>
        </select>
      </label>
      <label>Priorité
        <select id="cf-priority">
          <option value="">—</option><option value="basse">Basse</option>
          <option value="normale">Normale</option><option value="haute">Haute</option>
        </select>
      </label>
    </div>
    <label class="inline night-toggle" title="La carte part en file la nuit (1 h – 8 h, heure de Paris) au lieu de tout de suite">
      <input type="checkbox" id="cf-night"> 🌙 Night shift : à traiter la nuit (1 h – 8 h) <span class="muted">· enregistré aussitôt</span></label>
    <label>Titre <input id="cf-title" maxlength="200" required></label>
    <label>Description <textarea id="cf-desc" rows="4" maxlength="8000"></textarea></label>
    <label>Chapeau (carte parent, optionnel) <select id="cf-parent"></select></label>
    <div class="row">
      <label>Jalon <select id="cf-milestone"></select></label>
      <label>Échéance <input type="date" id="cf-due"></label>
    </div>
    <label>Asset lié (optionnel) <input id="cf-asset" list="asset-ids" placeholder="gordeka/persos/amaia/animations"></label>
    <datalist id="asset-ids"></datalist>
    <label id="cf-detail-label" hidden>Détail : animation visée (optionnel)
      <input id="cf-detail" list="detail-ids" maxlength="100" placeholder="walk"></label>
    <datalist id="detail-ids"></datalist>
    <p class="error" id="card-error" role="alert"></p>
    <div class="row end">
      <button type="button" id="cf-delete" class="danger">Supprimer</button>
      <span class="spacer"></span>
      <span id="cf-dirty" class="dirty" hidden>● Modifications non enregistrées</span>
      <button type="button" id="cf-cancel" class="ghost">Fermer</button>
      <button type="submit" id="cf-save" class="primary">Enregistrer</button>
    </div>
  </form>
  <!-- Hors du formulaire de la carte : le commentaire d'asset a son propre formulaire. -->
  <section id="cf-asset-view" class="card-asset" hidden></section>
  <div id="cf-thread">
      <h3 id="cf-children-title">Enfants</h3>
      <ul id="cf-children" class="kids"></ul>
      <button type="button" id="cf-add-child" class="small">+ Carte enfant</button>
      <button type="button" id="cf-night-children" class="small" title="Donne à tous les enfants le night shift coché ci-dessus">🌙 Appliquer le night shift aux enfants</button>
      <h3>Historique et commentaires</h3>
      <div id="cf-feed" class="feed"></div>
      <label>Commenter <textarea id="cf-note" rows="2" maxlength="8000" placeholder="Une remarque, une précision pour itérer…"></textarea></label>
      <div class="row end"><span class="spacer"></span>
        <button type="button" id="cf-comment-send" class="small primary">Commenter</button></div>
  </div>
  <!-- Mobile : Accepter / Refuser collés en bas de l'écran. -->
  <div id="cf-qa-bar" class="qa-actions qa-sticky" hidden>
    <button type="button" id="cf-accept2" class="accept">✓ Accepter</button>
    <button type="button" id="cf-refuse2" class="refuse">✗ Refuser</button>
  </div>
</dialog>

<dialog id="refuse-dialog">
  <form id="refuse-form" method="dialog">
    <h2 id="refuse-title">Refuser</h2>
    <label>Ce qui ne va pas (obligatoire) — la carte repart en Doing, à retraiter
      <textarea id="rf-body" rows="4" maxlength="8000" placeholder="Ex. la marche glisse, les pieds ne restent pas au sol"></textarea></label>
    <p class="error" id="rf-error" role="alert"></p>
    <div class="row end"><span class="spacer"></span>
      <button type="button" id="rf-cancel" class="ghost">Annuler</button>
      <button type="submit" id="rf-send" class="refuse">✗ Refuser</button></div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
