<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Miarritze Producer</title>
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1 class="brand">PRODUCER</h1>
  <nav class="tabs" id="tabs" hidden>
    <a href="#/assets" data-tab="assets">Assets</a>
    <a href="#/kanban" data-tab="kanban">Kanban</a>
    <a href="#/comments" data-tab="comments">Commentaires</a>
  </nav>
  <div class="top-actions">
    <button type="button" id="theme" class="ghost" title="Fond clair / sombre">◐</button>
    <button type="button" id="logout" class="ghost" hidden>Déconnexion</button>
  </div>
</header>

<main id="app">
  <section id="login" class="login" hidden>
    <form id="login-form" class="panel">
      <h2>Connexion</h2>
      <label>Mot de passe
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Entrer</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <section id="view-assets" class="view" hidden>
    <aside class="sidebar">
      <input type="search" id="search" placeholder="Rechercher (maia, idle, fronton…)" aria-label="Rechercher">
      <ul id="cats" class="cats"></ul>
    </aside>
    <div class="assets-main">
      <div id="grid" class="grid"></div>
      <div id="detail" class="detail" hidden></div>
    </div>
  </section>

  <section id="view-kanban" class="view" hidden>
    <div class="kanban-bar">
      <button type="button" id="new-card" class="primary">+ Nouvelle carte</button>
      <label class="inline">Chapeau <select id="kb-hat" aria-label="Filtrer par chapeau"></select></label>
      <label class="inline"><input type="checkbox" id="kb-hats-only"> Chapeaux seulement</label>
    </div>
    <div id="board" class="board"></div>
  </section>

  <section id="view-comments" class="view" hidden>
    <div class="kanban-bar">
      <label class="inline"><input type="checkbox" id="only-open" checked> Ouverts seulement</label>
    </div>
    <div id="comment-list" class="comment-list"></div>
  </section>
</main>

<dialog id="card-dialog">
  <form id="card-form" method="dialog" class="card-form">
    <h2 id="card-dialog-title">Carte</h2>
    <p class="muted small-text" id="cf-origin"></p>
    <p class="rework" id="cf-rework" hidden>↺ Refusée en QA : à retraiter (voir le refus dans l'historique)</p>
    <div class="qa-actions" id="cf-qa" hidden>
      <button type="button" id="cf-accept" class="accept">✓ Accepter</button>
      <button type="button" id="cf-refuse" class="refuse">✗ Refuser</button>
    </div>
    <div class="row">
      <label>Type
        <select id="cf-type">
          <option value="feature">Feature</option><option value="bug">Bug</option>
          <option value="perso">Perso</option><option value="animation">Animation</option>
          <option value="asset">Asset (décor, image…)</option><option value="gameplay">Gameplay</option>
          <option value="pixelforge">Pixelforge</option>
        </select>
      </label>
      <label>Priorité
        <select id="cf-priority">
          <option value="">—</option><option value="basse">Basse</option>
          <option value="normale">Normale</option><option value="haute">Haute</option>
        </select>
      </label>
    </div>
    <label>Titre <input id="cf-title" maxlength="200" required></label>
    <label>Description <textarea id="cf-desc" rows="4" maxlength="8000"></textarea></label>
    <label>Chapeau (carte parent, optionnel) <select id="cf-parent"></select></label>
    <label>Asset lié (optionnel) <input id="cf-asset" list="asset-ids" placeholder="gordeka/persos/amaia/animations"></label>
    <datalist id="asset-ids"></datalist>
    <label id="cf-detail-label" hidden>Détail : animation visée (optionnel)
      <input id="cf-detail" list="detail-ids" maxlength="100" placeholder="walk"></label>
    <datalist id="detail-ids"></datalist>
    <p class="error" id="card-error" role="alert"></p>
    <div class="row end">
      <button type="button" id="cf-delete" class="danger">Supprimer</button>
      <span class="spacer"></span>
      <button type="button" id="cf-cancel" class="ghost">Fermer</button>
      <button type="submit" id="cf-save" class="primary">Enregistrer</button>
    </div>
  </form>
  <!-- Hors du formulaire de la carte : le commentaire d'asset a son propre formulaire. -->
  <section id="cf-asset-view" class="card-asset" hidden></section>
  <div id="cf-thread">
      <h3 id="cf-children-title">Enfants</h3>
      <ul id="cf-children" class="kids"></ul>
      <button type="button" id="cf-add-child" class="small">+ Carte enfant</button>
      <h3>Historique et commentaires</h3>
      <div id="cf-feed" class="feed"></div>
      <label>Commenter <textarea id="cf-note" rows="2" maxlength="8000" placeholder="Une remarque, une précision pour itérer…"></textarea></label>
      <div class="row end"><span class="spacer"></span>
        <button type="button" id="cf-comment-send" class="small primary">Commenter</button></div>
  </div>
</dialog>

<dialog id="refuse-dialog">
  <form id="refuse-form" method="dialog">
    <h2 id="refuse-title">Refuser</h2>
    <label>Ce qui ne va pas (obligatoire) — la carte repart en Doing, à retraiter
      <textarea id="rf-body" rows="4" maxlength="8000" placeholder="Ex. la marche glisse, les pieds ne restent pas au sol"></textarea></label>
    <p class="error" id="rf-error" role="alert"></p>
    <div class="row end"><span class="spacer"></span>
      <button type="button" id="rf-cancel" class="ghost">Annuler</button>
      <button type="submit" id="rf-send" class="refuse">✗ Refuser</button></div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
