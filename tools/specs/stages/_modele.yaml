# Fiche de conception d'un décor (copier en <id>.yaml). À valider par
# Julien avant génération. « intention » en français pour Julien ;
# « prompt » en anglais pour Retro Diffusion.
id: nouveau_decor
statut: brouillon
nom: Nom affiché dans le jeu
lieu: >-
  Lieu réel de Biarritz / du Pays basque, ce qu'on doit reconnaître du premier
  coup d'œil (monument, côte, ambiance).
heure: jour            # jour | soir | crépuscule | nuit
intention: >-
  Ce que l'enfant doit ressentir (fête, calme, épique…), éléments lisibles.
prompt: >-
  wide side-scrolling fighting game background, pixel art, <lieu>, <heure>, readable
  silhouettes, no characters in the foreground, no text
palette: [ "#ce3434", "#174e76" ]   # couleurs dominantes souhaitées
plans:
  lointain: {parallaxe: 0.25, anime: 3 images (vagues, drapeaux…), largeur: 576}
  sol: {matiere: sable | pavés | parquet | herbe | carrelage, hauteur: 40}
  premier_plan: aucun   # jamais d'objet qui cache les combattants
ambiance:
  props: [gull]          # gull | beam | bubbles | confetti | spray
  particules_impact: sand  # sand | water | wood | stone | flour
musique:
  air: Nom de l'air traditionnel basque (domaine public, source vérifiée)
  instruments: txistu, trikitixa…
contraintes:
  - le ciel du haut de l'image doit être uni (prolongé sur les écrans hauts)
  - rien d'important dans les 40 px de gauche/droite (coupés sur 16:9)
  - contraste suffisant derrière les persos (silhouettes lisibles)
