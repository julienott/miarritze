# Fiche de conception — Kaio, le goéland voleur (archétype aérien).
# Statut « brouillon » : à valider par Julien (planche de poses clés) avant
# toute génération. Les « intention » sont pour Julien (français) ; les
# « geste » sont les consignes envoyées à Retro Diffusion (anglais).
id: kaio
statut: brouillon
apparence: >-
  a cheeky anthropomorphic seagull standing upright on two orange webbed feet, big yellow beak with a red
  dot, white head and belly, light grey wings used as arms with feathered fingertips, small grey tail,
  wearing nothing, wings empty, mischievous grin, kid friendly cartoon
# Ce qu'il tient : rien en garde ; le sachet de chips n'apparaît que dans
# « Vol à l'étalage » et la victoire (sinon il pollue tous les coups).
porte:
  garde: rien (ailes vides)
  sp_down: un petit sachet de chips volé
  win: le sachet de chips
hauteur: 112
groupes_couleur:
  plumes:      # ailes et dos gris → recolorés par les costumes
    sat: [0, 0.18]
    val: [0.35, 0.82]
    composante_min: 150
  # pattes et bec orange/jaune : non listés → gardés tels quels
costumes:
  1: {plumes: night}
  2: {plumes: sand}
  3: {plumes: purple}
mouvements:
  idle:
    intention: garde, les ailes à demi ouvertes devant lui, il se dandine
    mode: attente
    images: 8
    geste: bobbing in place in a cheeky fighting stance, wings half open in front of the chest, no effects
    depart: neutre
  walk:
    intention: marche en se dandinant, pattes palmées bien visibles
    mode: marche
    images: 8
    geste: waddles forward like a seagull, head bobbing, wings slightly open for balance
    depart: neutre
  run:
    intention: court en sautillant, ailes écartées
    mode: marche
    images: 8
    geste: hops forward quickly, wings spread wide, leaning forward
    depart: neutre
  crouch:
    intention: se ramasse au sol, ailes repliées, tête rentrée
    mode: action
    images: 6
    geste: crouches very low on bent legs, tucks the head between the shoulders, wings folded in front, then holds the low pose, no effects
    depart: neutre
  jump:
    intention: bat des ailes et décolle
    mode: action
    images: 8
    geste: flaps both wings hard and jumps straight up, then glides down and lands, no effects
    depart: neutre
  jump_fwd:
    intention: bond plané vers l'avant
    mode: action
    images: 6
    geste: leaps forward and glides with wings spread wide, legs tucked, no effects
    depart: neutre
  block:
    intention: croise les ailes devant le bec pour se protéger
    mode: action
    images: 4
    geste: crosses both wings in front of the face like a shield, braced, eyes squeezed, no effects
    depart: neutre
  crouch_block:
    intention: accroupi, ailes croisées devant lui
    mode: action
    images: 4
    geste: stays in the low crouch and crosses both wings in front of the face, no effects
    depart: crouch:au_plus_bas
  punch_1:
    intention: petit coup de bec rapide vers l'avant
    mode: attaque
    images: 6
    geste: quick forward peck with the beak, neck stretched far forward, then pulls back
    depart: neutre
  punch_2:
    intention: claque de l'aile avant, l'aile bien tendue
    mode: action
    images: 6
    geste: swings the front wing forward in a fast slap, wing fully extended forward at head height, no effects
    depart: neutre
  punch_3:
    intention: grand revers des deux ailes
    mode: action
    images: 6
    geste: spins once and swats forward with both wings fully extended, no effects
    depart: neutre
  kick:
    intention: coup de patte palmée tendue à hauteur du ventre
    mode: attaque
    images: 6
    geste: kicks forward with one webbed foot, leg fully extended at belly height
    depart: neutre
  kick_high:
    intention: coup de patte haut, à hauteur de tête
    mode: action
    images: 6
    geste: hops and kicks one webbed foot high at head height, leg fully extended forward, no effects
    depart: neutre
  crouch_punch:
    intention: accroupi, coup de bec bas vers l'avant
    mode: action
    images: 6
    geste: from the low crouch, pecks forward low at knee height with the neck stretched out, no effects
    depart: crouch:au_plus_bas
  sweep:
    intention: accroupi, balaie le sol avec la patte tendue
    mode: action
    images: 6
    geste: from the low crouch, sweeps one webbed foot far forward along the ground, no effects
    depart: crouch:au_plus_bas
  uppercut:
    intention: s'envole d'un coup en frappant vers le haut avec l'aile
    mode: action
    images: 6
    geste: springs upward and swings one wing straight up above the head, wing fully extended upward, no effects
    depart: neutre
  jump_punch:
    intention: en l'air, coup de bec plongeant
    mode: action
    images: 4
    geste: in mid-air, wings spread, pecks diagonally downward with the neck stretched out, no effects
    depart: jump:en_l_air
  throw:
    intention: seul, mime d'attraper et de jeter par-dessus son épaule
    mode: action
    images: 8
    geste: alone, grabs with both wings in front then flings them over the shoulder in a throwing motion, no other character, no effects
    depart: neutre
  thrown:
    intention: projeté en l'air, il tournoie en perdant quelques plumes
    mode: action
    images: 6
    geste: is lifted and spins backward through the air upside down, wings flapping wildly, surprised face, cartoon, no injury
    depart: neutre
  hit_high:
    intention: la tête part en arrière, yeux plissés
    mode: action
    images: 4
    geste: head snaps backward and he staggers back one step with eyes squeezed shut, feathers ruffled, cartoon, no injury, no effects
    depart: neutre
  hit_low:
    intention: plié en deux, ailes sur le ventre
    mode: action
    images: 4
    geste: bends forward holding his belly with both wings, eyes squeezed shut, staggers back, cartoon, no injury, no effects
    depart: neutre
  knockdown:
    intention: tombe en arrière, à plat sur le dos, pattes en l'air
    mode: action
    images: 6
    geste: topples backward and lands flat on his back on the ground, webbed feet in the air, cartoon, no injury, no effects
    depart: neutre
  dizzy:
    intention: étourdi, il titube, des étoiles autour de la tête
    mode: action
    images: 6
    geste: dizzy and wobbling in place with swirly eyes and little cartoon stars above the head
    depart: neutre
  win:
    intention: grignote une chips et rigole « HIHIHI »
    mode: action
    images: 8
    geste: pulls out a small bag of chips, eats one happily and laughs with the beak wide open, no effects
    depart: neutre
  intro:
    intention: atterrit en planant puis se met en garde
    mode: action
    images: 8
    geste: lands from a short glide with wings spread, folds the wings and takes a cheeky fighting stance, no effects
    depart: neutre
  sp_neutral:
    mode: action
    images: 8
    geste: hops up and flaps the wings, turning the tail toward the opponent with a cheeky look, cartoon, no effects
    depart: neutre
  sp_forward:
    mode: action
    images: 8
    geste: dives forward horizontally beak first like a diving seabird, wings swept back, body parallel to the ground, no effects
    depart: neutre
  sp_down:
    mode: action
    images: 8
    geste: dashes forward low, snatches something with the beak and hops back holding a small bag of chips, no effects
    depart: neutre
  sp_up:
    mode: action
    images: 8
    geste: flaps both wings hard and shoots straight up into the air, legs tucked, no effects
    depart: neutre
  super:
    mode: action
    images: 12
    geste: whistles with the beak raised, then charges forward flapping wildly with wings spread, beak first, no effects
    depart: neutre
  finisher:
    mode: action
    images: 12
    geste: laughs with the beak wide open holding his belly, then does a proud little dance hop with wings raised, no effects
    depart: neutre
reprises:
  jump_up: {depuis: jump, images: images 1-5}
  fall: {depuis: jump, images: images 4-6}
  crouch_idle: {depuis: crouch, images: tenue}
  # RD anime mal un perso en l'air : images au sol réussies placées en l'air
  jump_kick: {depuis: kick, images: tout}
  hit_air: {depuis: knockdown, images: images 0-3}
  getup: {depuis: knockdown, images: a_l_envers}
  ko: {depuis: knockdown, images: chute_puis_sol}
speciaux:
  sp_neutral:
    nom: Fiente !
    intention: sautille, se retourne et lâche une fiente qui tombe en cloche (comique, jamais sale)
    effet: petit « splat » blanc à l'impact
    projectile: {nom: fiente, description: petite goutte blanche cartoon avec un reflet, 16 px}
    son: goéland qui ricane
  sp_forward:
    nom: Piqué
    intention: plonge à l'horizontale bec en avant, comme un fou de Bassan
    effet: traînée de vent blanc derrière lui, plumes qui s'envolent
  sp_down:
    nom: Vol à l'étalage
    intention: fonce bas, chipe de la jauge à l'adversaire et repart avec un sachet de chips
    effet: petites étoiles « chips » qui volent, sachet visible dans le bec
  sp_up:
    nom: Envol
    intention: décolle à la verticale en battant fort des ailes
    effet: rafale de plumes et de vent sous lui
  super:
    nom: Nuée de goélands
    intention: siffle et une nuée de goélands traverse l'écran avec lui
    effet: 6 à 8 goélands en vol qui traversent l'écran (sprite animé), ombres au sol
