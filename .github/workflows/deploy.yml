name: Build & deploy web export

# Pivot 2026-10-19 : main = Miarritze Gordeka (prototype), qui ne se déploie pas encore ;
# le site garde Borroka (branche `borroka`). Déploiement à la main seulement, sur décision de Julien.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # Extension WebRTC native (addons/webrtc_native) : fait partie du « moteur » pour
  # l'auto-update (paquet complet si elle change). Égal à RUNTIME_TAG de updater.gd.
  WEBRTC_TAG: "webrtc1.2.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Godot headless + templates web sont mis en cache (~120 Mo) pour
      # éviter de retélécharger le .tpz de 1,2 Go à chaque run.
      - name: Cache Godot + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot + web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # On n'extrait que les templates web (le .tpz complet fait 1,2 Go décompressé)
          unzip -q templates.tpz "templates/web_*" "templates/version.txt" -d /tmp/tpz
          mv /tmp/tpz/templates/* "$TPL_DIR/"

      - name: Import project resources
        run: ~/godot-bin/godot --headless --import || true

      - name: Export Web (release)
        run: |
          mkdir -p web/build
          ~/godot-bin/godot --headless --export-release "Web" web/build/index.html
          test -f web/build/index.wasm && test -f web/build/index.pck

      - name: PHP lint
        run: find backend producer tools/producer -name '*.php' -print0 | xargs -0 -n1 php -l

      # /producer : service privé de Julien (assets, commentaires, kanban),
      # voir docs/PRODUCER.md. Aperçus colorisés + index générés depuis assets/.
      - name: Build producer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m venv /tmp/producer-venv
          /tmp/producer-venv/bin/pip install --quiet pillow numpy
          tools/producer/build.sh web/build/producer /tmp/producer-venv/bin/python

      # Le mot de passe et le jeton ne sont jamais écrits en clair : config.php
      # (non versionné) ne contient que leurs hachages. Sans les secrets, on
      # n'envoie pas de config et celle du serveur reste en place.
      - name: Producer config (secrets)
        env:
          PRODUCER_PASSWORD: ${{ secrets.PRODUCER_PASSWORD }}
          PRODUCER_TOKEN: ${{ secrets.PRODUCER_TOKEN }}
        run: |
          if [ -z "$PRODUCER_PASSWORD" ] || [ -z "$PRODUCER_TOKEN" ]; then
            echo "::warning::Secrets PRODUCER_PASSWORD / PRODUCER_TOKEN absents : config producer non générée"
          else
            php tools/producer/make_config.php web/build/producer/config.php
          fi

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # Force l'auth par mot de passe — sans ces flags, ssh tente publickey
      # d'abord et un MaxAuthTries bas côté serveur peut nous bloquer avant
      # d'atteindre la tentative par mot de passe. (Même pattern que sutorimu.)
      # Pas de --delete : FTP_PATH pourrait contenir d'autres fichiers (API
      # backend plus tard) ; les fichiers index.* sont simplement écrasés.
      # landing/ : fond, logo et police de la page d'accueil (web/shell.html).
      - name: Copy PWA + landing assets dans le build
        run: |
          mkdir -p web/build/pwa web/build/landing
          cp web/pwa/*.png web/build/pwa/
          cp web/pwa/manifest.webmanifest web/build/pwa/manifest.webmanifest
          cp web/landing/* web/build/landing/
          test -f web/build/landing/bg_menu_0.png && test -f web/build/landing/press_start_2p.ttf

      # Relais TURN (connexion en 4G / NAT strict) : identifiants Cloudflare lus dans
      # les secrets, écrits dans backend/turn.php (gitignoré) ; absents = STUN seul.
      - name: TURN config
        env:
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -n "$CF_TURN_KEY_ID" ] && [ -n "$CF_TURN_API_TOKEN" ]; then
            php -r 'file_put_contents("backend/turn.php", "<?php\nreturn " . var_export(["cloudflare_turn" => ["key_id" => getenv("CF_TURN_KEY_ID"), "api_token" => getenv("CF_TURN_API_TOKEN")]], true) . ";\n");'
            php -l backend/turn.php
          else
            echo "Pas de relais TURN configuré (secrets CF_TURN_KEY_ID / CF_TURN_API_TOKEN)"
          fi

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cp web/.htaccess web/build/.htaccess
          SSH_OPTS="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          # producer/data/ (SQLite + sessions) n'est jamais dans le build ni touché.
          sshpass -e rsync -avz -e "$SSH_OPTS" \
            --exclude='producer/data/' --exclude='producer/files/' \
            web/build/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/"
          # Aperçus producer : miroir exact (--delete limité à producer/files/).
          sshpass -e rsync -az --delete -e "$SSH_OPTS" \
            web/build/producer/files/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/producer/files/"
          # API : backend/ → api/ (la base SQLite vit dans api/db/, jamais écrasée
          # car *.sqlite est exclu ; config.php prod pareil).
          sshpass -e rsync -avz -e "$SSH_OPTS" \
            --exclude='*.sqlite*' --exclude='config.php' \
            backend/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/api/"

  # Version Steam Deck (Linux x86_64), voir docs/STEAMDECK.md : export,
  # archive + .pck + manifest.json, publiés dans /steamdeck/ à côté du jeu
  # web. Job indépendant : un échec ici ne bloque jamais le déploiement web.
  # Le numéro de build (run_number de CE workflow) est ce que le jeu compare
  # pour se mettre à jour : il doit rester croissant (ne pas renommer le
  # fichier sans relever le compteur, cf. doc).
  steamdeck:
    runs-on: ubuntu-latest
    # Deux pushs rapprochés : on publie dans l'ordre, jamais un manifeste plus ancien en dernier.
    concurrency:
      group: steamdeck-deploy
      cancel-in-progress: false
    env:
      SITE_URL: https://miarritze.ijulien.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + Linux templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      # Seul le modèle Linux x86_64 release est utile (~70 Mo).
      - name: Install Godot + Linux export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/release/install_godot.sh "$GODOT_VERSION" linux_release.x86_64

      # Version = numéro de run + SHA court, injectée dans la copie de travail
      # de la CI (project.godot versionné reste sans numéro : « dev »).
      - name: Version du build
        id: version
        run: |
          BUILD="${{ github.run_number }}"
          VERSION="${BUILD}-${GITHUB_SHA::7}"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 tools/release/set_version.py "$BUILD" "$VERSION"
          grep -n '^config/' project.godot

      - name: Import project resources
        run: ~/godot-bin/godot --headless --import || true

      - name: Export SteamDeck (release)
        run: |
          mkdir -p exports/steamdeck
          ~/godot-bin/godot --headless --export-release "SteamDeck" exports/steamdeck/MiarritzeBorroka.x86_64
          test -x exports/steamdeck/MiarritzeBorroka.x86_64 && test -f exports/steamdeck/MiarritzeBorroka.pck

      # .tar.gz plutôt qu'AppImage : l'auto-update doit pouvoir réécrire le
      # jeu sur place, et une AppImage est en lecture seule (squashfs + FUSE).
      - name: Package (archive + pck + manifeste)
        run: |
          tools/steamdeck/package.sh exports/steamdeck web/build/steamdeck \
            "${{ steps.version.outputs.build }}" "${{ steps.version.outputs.version }}" \
            "$GODOT_VERSION+$WEBRTC_TAG" "$SITE_URL/steamdeck"
          cp web/steamdeck/index.html web/steamdeck/install.sh web/steamdeck/.htaccess web/build/steamdeck/
          bash -n web/build/steamdeck/install.sh
          ls -la web/build/steamdeck

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiarritzeBorroka-steamdeck-${{ steps.version.outputs.version }}
          path: web/build/steamdeck/*.tar.gz
          retention-days: 14

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Même hébergement et mêmes secrets que le job deploy. Ordre : d'abord
      # les fichiers (sans le manifeste), puis le manifeste et le ménage des
      # anciennes versions (--delete limité à steamdeck/) : un client ne lit
      # jamais un manifeste qui pointe vers un fichier pas encore envoyé.
      - name: Deploy /steamdeck via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          SSH_OPTS="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          DEST="${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/steamdeck/"
          sshpass -e rsync -az -e "$SSH_OPTS" --exclude='manifest.json' web/build/steamdeck/ "$DEST"
          sshpass -e rsync -az --delete -e "$SSH_OPTS" web/build/steamdeck/ "$DEST"

  # Version Recalbox (Raspberry Pi 4/5 en 64 bits + PC x86_64), voir
  # docs/RECALBOX.md : deux exports (un .pck commun), un .zip par architecture
  # à décompresser sur la partition share, manifest.json, publiés dans
  # /recalbox/. Job indépendant (comme steamdeck) : un échec ici ne bloque
  # jamais le déploiement web. Même numéro de build (run_number de CE
  # workflow) : il doit rester croissant.
  recalbox:
    runs-on: ubuntu-latest
    concurrency:
      group: recalbox-deploy
      cancel-in-progress: false
    env:
      SITE_URL: https://miarritze.ijulien.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + Linux arm64/x86_64 templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-recalbox

      - name: Install Godot + Linux export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/release/install_godot.sh "$GODOT_VERSION" linux_release.arm64 linux_release.x86_64

      - name: Version du build
        id: version
        run: |
          BUILD="${{ github.run_number }}"
          VERSION="${BUILD}-${GITHUB_SHA::7}"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 tools/release/set_version.py "$BUILD" "$VERSION"
          grep -n '^config/' project.godot

      - name: Import project resources
        run: ~/godot-bin/godot --headless --import || true

      - name: Export Recalbox arm64 + x86_64 (release)
        run: |
          mkdir -p exports/recalbox/arm64 exports/recalbox/x86_64
          ~/godot-bin/godot --headless --export-release "Recalbox" exports/recalbox/arm64/MiarritzeBorroka.arm64
          ~/godot-bin/godot --headless --export-release "Recalbox x86_64" exports/recalbox/x86_64/MiarritzeBorroka.x86_64
          test -f exports/recalbox/arm64/MiarritzeBorroka.arm64 && test -f exports/recalbox/arm64/MiarritzeBorroka.pck
          test -f exports/recalbox/x86_64/MiarritzeBorroka.x86_64 && test -f exports/recalbox/x86_64/MiarritzeBorroka.pck

      - name: Package (zips + pck + manifeste)
        run: |
          bash -n tools/recalbox/MiarritzeBorroka.sh
          python3 tools/recalbox/package.py exports/recalbox web/build/recalbox \
            "${{ steps.version.outputs.build }}" "${{ steps.version.outputs.version }}" \
            "$GODOT_VERSION+$WEBRTC_TAG" "$SITE_URL/recalbox"
          cp web/recalbox/index.html web/recalbox/install.sh web/recalbox/.htaccess web/build/recalbox/
          bash -n web/build/recalbox/install.sh
          ls -la web/build/recalbox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiarritzeBorroka-recalbox-${{ steps.version.outputs.version }}
          path: web/build/recalbox/*.zip
          retention-days: 14

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Même hébergement et mêmes secrets que les autres jobs ; d'abord les
      # fichiers, puis le manifeste et le ménage (--delete limité à recalbox/).
      - name: Deploy /recalbox via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          SSH_OPTS="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          DEST="${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/recalbox/"
          sshpass -e rsync -az -e "$SSH_OPTS" --exclude='manifest.json' web/build/recalbox/ "$DEST"
          sshpass -e rsync -az --delete -e "$SSH_OPTS" web/build/recalbox/ "$DEST"
