name: Build & deploy web export

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Godot headless + templates web sont mis en cache (~120 Mo) pour
      # éviter de retélécharger le .tpz de 1,2 Go à chaque run.
      - name: Cache Godot + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot + web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL_DIR"
          curl -sL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # On n'extrait que les templates web (le .tpz complet fait 1,2 Go décompressé)
          unzip -q templates.tpz "templates/web_*" "templates/version.txt" -d /tmp/tpz
          mv /tmp/tpz/templates/* "$TPL_DIR/"

      - name: Import project resources
        run: ~/godot-bin/godot --headless --import || true

      - name: Export Web (release)
        run: |
          mkdir -p web/build
          ~/godot-bin/godot --headless --export-release "Web" web/build/index.html
          test -f web/build/index.wasm && test -f web/build/index.pck

      - name: PHP lint
        run: find backend producer tools/producer -name '*.php' -print0 | xargs -0 -n1 php -l

      # /producer : service privé de Julien (assets, commentaires, kanban),
      # voir docs/PRODUCER.md. Aperçus colorisés + index générés depuis assets/.
      - name: Build producer
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m venv /tmp/producer-venv
          /tmp/producer-venv/bin/pip install --quiet pillow numpy
          tools/producer/build.sh web/build/producer /tmp/producer-venv/bin/python

      # Le mot de passe et le jeton ne sont jamais écrits en clair : config.php
      # (non versionné) ne contient que leurs hachages. Sans les secrets, on
      # n'envoie pas de config et celle du serveur reste en place.
      - name: Producer config (secrets)
        env:
          PRODUCER_PASSWORD: ${{ secrets.PRODUCER_PASSWORD }}
          PRODUCER_TOKEN: ${{ secrets.PRODUCER_TOKEN }}
        run: |
          if [ -z "$PRODUCER_PASSWORD" ] || [ -z "$PRODUCER_TOKEN" ]; then
            echo "::warning::Secrets PRODUCER_PASSWORD / PRODUCER_TOKEN absents : config producer non générée"
          else
            php tools/producer/make_config.php web/build/producer/config.php
          fi

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # Force l'auth par mot de passe — sans ces flags, ssh tente publickey
      # d'abord et un MaxAuthTries bas côté serveur peut nous bloquer avant
      # d'atteindre la tentative par mot de passe. (Même pattern que sutorimu.)
      # Pas de --delete : FTP_PATH pourrait contenir d'autres fichiers (API
      # backend plus tard) ; les fichiers index.* sont simplement écrasés.
      # landing/ : fond, logo et police de la page d'accueil (web/shell.html).
      - name: Copy PWA + landing assets dans le build
        run: |
          mkdir -p web/build/pwa web/build/landing
          cp web/pwa/*.png web/build/pwa/
          cp web/pwa/manifest.webmanifest web/build/pwa/manifest.webmanifest
          cp web/landing/* web/build/landing/
          test -f web/build/landing/bg_menu_0.png && test -f web/build/landing/press_start_2p.ttf

      - name: Deploy via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cp web/.htaccess web/build/.htaccess
          SSH_OPTS="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          # producer/data/ (SQLite + sessions) n'est jamais dans le build ni touché.
          sshpass -e rsync -avz -e "$SSH_OPTS" \
            --exclude='producer/data/' --exclude='producer/files/' \
            web/build/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/"
          # Aperçus producer : miroir exact (--delete limité à producer/files/).
          sshpass -e rsync -az --delete -e "$SSH_OPTS" \
            web/build/producer/files/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/producer/files/"
          # API : backend/ → api/ (la base SQLite vit dans api/db/, jamais écrasée
          # car *.sqlite est exclu ; config.php prod pareil).
          sshpass -e rsync -avz -e "$SSH_OPTS" \
            --exclude='*.sqlite*' --exclude='config.php' \
            backend/ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/api/"
