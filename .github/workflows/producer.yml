name: Producer (publication du build local)

# Julien (2026-10-20) : /producer est préparé EN LOCAL (tools/producer/publie.sh) et poussé sur la
# branche orpheline `producer-build` ; ce workflow ne fait plus que le copier sur le serveur.
# producer/data/ (SQLite, sessions) n'est jamais touché ; config.php n'est régénérée que si les
# secrets sont présents (le build local n'en contient jamais).
on:
  workflow_dispatch:     # lancé par publie.sh (et en fin de deploy.yml)

jobs:
  producer:
    runs-on: ubuntu-latest
    concurrency:
      group: producer-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout du build
        uses: actions/checkout@v4
        with:
          ref: producer-build
          path: producer

      - name: Producer config (secrets)
        env:
          PRODUCER_PASSWORD: ${{ secrets.PRODUCER_PASSWORD }}
          PRODUCER_TOKEN: ${{ secrets.PRODUCER_TOKEN }}
        run: |
          rm -rf producer/.git
          if [ -z "$PRODUCER_PASSWORD" ] || [ -z "$PRODUCER_TOKEN" ]; then
            echo "::warning::Secrets PRODUCER_PASSWORD / PRODUCER_TOKEN absents : config producer non générée"
          else
            git clone -q --depth 1 --branch main "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" src
            php src/tools/producer/make_config.php producer/config.php
          fi

      - name: Deploy /producer via rsync over SSH
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          SSH_OPTS="ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          DEST="${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:${{ secrets.FTP_PATH }}/producer/"
          sshpass -e rsync -avz -e "$SSH_OPTS" --exclude='data/' --exclude='files/' producer/ "$DEST"
          # Aperçus : miroir exact (--delete limité à files/).
          sshpass -e rsync -az --delete -e "$SSH_OPTS" producer/files/ "${DEST}files/"
