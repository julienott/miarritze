name: Tests (Gordeka headless, salons, PHP)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-bin
      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
      - name: Import
        run: ~/godot-bin/godot --headless --path . --import || true
      - name: Tests de Gordeka (règles, IA, cartes, profils)
        run: ~/godot-bin/godot --headless --path . --fixed-fps 60 --script res://tests/gk_tests.gd
      - name: PHP lint
        run: find backend producer -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests des salons (API)
        run: python3 tests/backend/rooms_test.py
